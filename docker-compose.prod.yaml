services:
  traefik:
    image: traefik:v3.6
    command:
      - "--api.insecure=true"
      - "--providers.swarm=true"
      - "--providers.swarm.network=gova_network"
      - "--entrypoints.web.address=:80"
    ports:
      - 80:80
      - 8080:8080
    networks:
      - gova_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.role == manager

  postgres:
    ports:
      - 5432:5432

  kafka:
    hostname: kafka
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093

  redis:
    image: redis:8
    ports:
      - 6379:6379

  http_server:
    image: wifimemes/gova-backend
    ports:
      - 8000:8000
    networks:
      - gova_network
    command: http run
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.http_server.rule=Host(`api.gova.chat`)"
        - "traefik.http.routers.http_server.service=gova_stack_http_server"
        - "traefik.http.routers.http_server.entrypoints=web"
        - "traefik.http.services.gova_stack_http_server.loadbalancer.server.port=8000"
      update_config:
        parallelism: 1
        delay: 3s
        failure_action: rollback
        monitor: 10s
        order: start-first

  moderator_orchestrator:
    image: wifimemes/gova-backend
    networks:
      - gova_network
    command: orchestrator run

  event_handler:
    image: wifimemes/gova-backend
    networks:
      - gova_network
    command: event_handler run

  db_upgrade:
    image: wifimemes/gova-backend
    networks:
      - gova_network
    command: db upgrade

networks:
  gova_network:
    driver: overlay
    name: gova_network
    external: true
