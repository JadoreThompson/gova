services:
  traefik:
    image: traefik:v3.6
    command:
      - "--api.insecure=true"
      - "--providers.swarm=true"
      - "--providers.swarm.network=gova_network"
      - "--entrypoints.web.address=:80"
    ports:
      - 80:80
      - 8080:8080
    networks:
      - gova_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.role == manager

  shepherd:
    image: containrrr/shepherd:latest
    environment:
      TZ: "UTC"
      SLEEP_TIME: "30s"
      VERBOSE: "true"
      WITH_REGISTRY_AUTH: "true"
      REGISTRY_HOST: "ghcr.io"
      REGISTRY_USER: "${IMAGE_REGISTRY_USERNAME}"
      REGISTRY_PASSWORD: "${IMAGE_REGISTRY_PASSWORD}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  postgres:
    ports:
      - 5432:5432

  kafka:
    hostname: kafka
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093

  redis:
    image: redis:8
    ports:
      - 6379:6379

  http_server:
    image: ${IMAGE_NAME:?}
    ports:
      - 8000:8000
    networks:
      - gova_network
    command: cd ./src && uv run uvicorn api.app:app --host 0.0.0.0 --port 8000
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.http_server.rule=Host(`api.gova.chat`)"
        - "traefik.http.routers.http_server.service=gova_stack_http_server"
        - "traefik.http.routers.http_server.entrypoints=web"
        - "traefik.http.services.gova_stack_http_server.loadbalancer.server.port=8000"
      update_config:
        parallelism: 1
        delay: 3s
        failure_action: rollback
        monitor: 10s
        order: start-first

  moderator_orchestrator:
    image: ${IMAGE_NAME:?}
    networks:
      - gova_network
    command: uv run src/main.py orchestrator run

  event_handler:
    image: ${IMAGE_NAME:?}
    networks:
      - gova_network
    command: uv run src/main.py event_handler run

  db_upgrade:
    image: ${IMAGE_NAME:?}
    networks:
      - gova_network
    command: uv run src/main.py db upgrade

networks:
  gova_network:
    driver: overlay
    name: gova_network
    external: true
